name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tools/bundle.lua --check
      - run: lua5.4 tests/run.lua
      - run: python3 -I -m unittest discover -s tests/tools
      - run: python3 -I tools/package.py --out dist
